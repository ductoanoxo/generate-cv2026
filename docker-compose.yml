services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taydo_backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    networks:
      - taydo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taydo_frontend
    ports:
      - "3000:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - taydo_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: taydo_ai_service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./ai-service:/app
    depends_on:
      - qdrant
    networks:
      - taydo_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: taydo_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - taydo_network

networks:
  taydo_network:
    driver: bridge

volumes:
  qdrant_data:
