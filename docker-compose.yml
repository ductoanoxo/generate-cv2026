services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taydo_backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DATABASE_URL}
    volumes:
      - ./backend:/app
      - /app/bin
      - /app/obj
    networks:
      - taydo_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taydo_frontend
    ports:
      - "3000:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - taydo_network

networks:
  taydo_network:
    driver: bridge
